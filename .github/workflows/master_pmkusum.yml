# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions
# More info on Python, GitHub Actions, and Azure App Service: https://aka.ms/python-webapps-actions

name: Build and deploy Python app to Azure Web App - pmkusum

on:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: pmkusum # Set this to your Azure Web App name
  AZURE_WEBAPP_PACKAGE_PATH: './voice_agent_project' # Path to the Django/FastAPI project
  PYTHON_VERSION: '3.13' # Python version to use (matches your provided YAML)
  
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Create and start virtual environment
        run: |
          python -m venv venv
          source venv/bin/activate
      
      - name: Install dependencies
        run: pip install -r requirements.txt
        working-directory: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}

      - name: Generate Prisma Client
        run: prisma generate
        working-directory: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}

      - name: Run Prisma migrations
        run: prisma db push
        working-directory: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        
      # Optional: Add step to run tests here (PyTest, Django test suites, etc.)

      - name: Upload artifact for deployment jobs
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: |
            ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}/.
            !${{ env.AZURE_WEBAPP_PACKAGE_PATH }}/venv/
  deploy:
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app
      
      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'pmkusum'
          slot-name: 'Production'
          startup-command: 'gunicorn --bind=0.0.0.0:8001 voice_agent_app.wsgi:application'

          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_C93E3A87E24141D283FE487F79CF6009 }}
